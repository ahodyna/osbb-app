<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSBB Requests</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="loader" style="display: none;">Завантаження...</div>

<h1>ОСББ звернення</h1>

<div id="auth-section">
  <div id="login-form">
    <h2>Увійти</h2>
    <input type="text" id="phone-login" placeholder="Введіть номер телефону" />
    <input type="password" id="password-login" placeholder="Введіть пароль" />
    <button id="login-btn">Увійти</button>
    <p>Ще не маєте акаунту? <a href="#" id="go-to-register">Зареєструватися</a></p>
  </div>

  <div id="register-form" style="display: none;">
    <h2>Зареєструватися</h2>
    <input type="text" id="phone-register" placeholder="Введіть номер телефону" />
    <input type="password" id="password-register" placeholder="Введіть пароль" />
    <button id="register-btn">Зареєструватися</button>
    <p>Вже є акаунт? <a href="#" id="go-to-login">Увійти</a></p>
  </div>
</div>


<div id="message-section" style="display: none;">
  <textarea id="message" placeholder="Ваше звернення..."></textarea><br/>

  <button id="beautify-btn">✨ Beautify AI ✨</button>
  <button id="send-btn">Надіслати</button>
  <div>  <button id="logout-user" >Вийти</button></div>
</div>

<div id="admin-section" style="display: none;">
  <h2>Запити користувачів</h2>

  <select id="section-select-admin">
    <option value="">Всі секції</option>
    <option value="technical">Технічні запити</option>
    <option value="administrative">Адміністративні питання</option>
    <option value="complaints">Скарги</option>
    <option value="service-request">Запит на послугу</option>
    <option value="general">Загальні питання</option>
    <option value="urgent">Екстрені запити</option>
    <option value="meeting">Запити на засідання ОСББ</option>
  </select>

  <ul id="requests-list"></ul>
  <div><button id="logout-user-admin">Вийти</button></div>
</div>

<div id="overlay" style="display: none;"></div>
<div id="modal" class="modal" style="display: none;">
  <p id="modal-message"></p>
  <button id="modal-btn">ОК</button>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
